apiVersion: apps/v1
kind: Deployment
metadata:
  name: isso-sf-ui
  namespace: isso-sf
spec:
  replicas: 1
  template:
    spec:
      imagePullSecrets:
      - name: ghcr-secret
      containers:
      - name: ui
        image: ghcr.io/khushal1198/isso_sf-ui:main-e2cccec
        env:
        - name: AWS_REGION
          value: "us-east-1"
        - name: ENVIRONMENT
          value: "production"
        - name: ISSO_STREAMING_AGENT_TOKEN
          valueFrom:
            secretKeyRef:
              name: isso-sf-secrets
              key: streaming-agent-token
        - name: ISSO_STREAMING_CONTROLS_ENABLED
          value: "true"
        - name: ISSO_STREAMING_OPERATORS
          value: "khushal@issosf.org"
        - name: ISSO_STREAMING_DESKTOP_OPERATORS
          value: ""
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
