apiVersion: v1
kind: ConfigMap
metadata:
  name: isso-sf-config
  namespace: isso-sf
  labels:
    app: isso-sf
data:
  # gRPC service discovery (in-cluster service names)
  CONTENT_SERVICE_HOST: "isso-sf-content"
  CONTENT_SERVICE_PORT: "50051"
  AUTH_SERVICE_HOST: "isso-sf-auth"
  AUTH_SERVICE_PORT: "50052"
  UI_SERVER_PORT: "8000"
  # Media storage
  ISSO_S3_REGION: "us-east-1"
  ISSO_S3_BUCKET: "isso-sf-media"
  # Public site base URL (used in email links: unsubscribe, RSVP, etc.)
  ISSO_SITE_BASE_URL: "https://issosf.org"
  # Email senders — SES-verified issosf.org (DKIM+MAIL FROM+DMARC configured)
  NEWSLETTER_FROM: "newsletter@issosf.org"
  NEWSLETTER_FROM_NAME: "ISSO San Francisco"
  RSVP_EMAIL_FROM: "rsvp@issosf.org"
